name: Scan code

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan
        run: |
          mkdir -p reports
          python3 build-system/ci/lite_scan.py > reports/lite-scan.txt
          wc -l reports/lite-scan.txt

      - name: Commit report
        run: |
          git config user.name "scan-bot"
          git config user.email "scan-bot@users.noreply.github.com"
          git add reports/lite-scan.txt
          git commit -m "scan report" || echo "no changes"
          git push
