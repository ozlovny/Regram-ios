name: Dump code

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dump
        run: python3 build-system/ci/lite_dump.py

      - name: Commit report
        run: |
          git config user.name "scan-bot"
          git config user.email "scan-bot@users.noreply.github.com"
          git add reports/lite-dump.txt
          git commit -m "dump report" || echo "no changes"
          git push
